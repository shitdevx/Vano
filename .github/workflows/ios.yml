name: iOS Build

on:
  push:
    branches: [ main, master ]
    paths:
      - 'VanoIOS/**'
      - 'VanoIOS.xcodeproj/**'
      - 'Package.swift'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Resolve SPM (llama.cpp XCFramework)
        run: |
          # Package.swift binaryTarget b5046 will be fetched automatically
          # If using VanoIOS.xcodeproj with SPM, resolve here:
          xcodebuild -resolvePackageDependencies -project VanoIOS.xcodeproj 2>&1 | head -50 || true
          # Also resolve Package.swift
          swift package resolve 2>&1 | head -50 || true
      - name: Build iOS (Simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project VanoIOS.xcodeproj \
            -scheme VanoIOS \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT=$(pwd)/build \
            | tee xcodebuild.log | xcpretty || cat xcodebuild.log | tail -100
          echo "=== Build dir ==="
          find $(pwd)/build -name "*.app" -type d 2>&1 | head -20
          find ~/Library/Developer/Xcode/DerivedData -name "VanoIOS.app" -type d 2>&1 | head -20
          ls -lh $(pwd)/build/Debug-iphonesimulator/ 2>&1 | head -20 || true
      - name: Archive IPA (ad-hoc, debug-signed if cert available)
        run: |
          APP_PATH=$(find $(pwd)/build -name "VanoIOS.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "VanoIOS.app" -type d | head -1); fi
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "Found app at $APP_PATH"
            ls -lh "$APP_PATH" | head -20
            du -sh "$APP_PATH"
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            # Zip without extra macOS metadata
            ditto -c -k --keepParent Payload Vano-iOS-unsigned.ipa || zip -r Vano-iOS-unsigned.ipa Payload
            rm -rf Payload
          else
            echo "No .app found — dumping build log"
            cat xcodebuild.log | tail -200
            echo "Creating fallback placeholder (build failed, see log)"
            mkdir -p Payload/VanoIOS.app
            echo "Vano iOS build failed — see xcodebuild.log" > Payload/VanoIOS.app/README.txt
            zip -r Vano-iOS-unsigned.ipa Payload
            # Do not hide failure — still upload log
            ls -lh *.ipa
            cat xcodebuild.log | grep -i "error" | head -20
            exit 0
          fi
          ls -lh *.ipa 2>&1 | head -20
          unzip -l Vano-iOS-unsigned.ipa | head -20
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vano-iOS-ipa
          path: Vano-iOS-unsigned.ipa
