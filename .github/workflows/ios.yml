name: iOS Build

on:
  push:
    branches: [ main, master ]
    paths:
      - 'VanoIOS/**'
      - 'VanoIOS.xcodeproj/**'
      - 'Package.swift'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Download LlamaFramework XCFramework
        run: |
          curl -L -o llama-xcframework.zip https://github.com/ggml-org/llama.cpp/releases/download/b5046/llama-b5046-xcframework.zip
          unzip -o llama-xcframework.zip
          mv build-apple/llama.xcframework ./llama.xcframework
          rm -rf build-apple llama-xcframework.zip
          # Extract flat headers (no module.modulemap) for bridging header
          mkdir -p llama-include
          cp llama.xcframework/ios-arm64_x86_64-simulator/llama.framework/Headers/*.h llama-include/
          rm -f llama-include/module.modulemap
          echo "=== Flat headers ==="
          ls llama-include/
          echo "=== Binary ==="
          file llama.xcframework/ios-arm64_x86_64-simulator/llama.framework/llama
      - name: Debug bridging header
        shell: bash {0}
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          FRONTEND=$(xcrun --find swift-frontend)
          echo "SDK: $SDK"
          echo "Frontend: $FRONTEND"
          echo ""
          echo "=== Test 1: swift-frontend typecheck WITH llama_bridging.h ==="
          echo 'import Foundation; func test() { let m: UnsafeMutablePointer<llama_model>? = nil; _ = m }' > /tmp/test1.swift
          $FRONTEND \
            -frontend \
            -target arm64-apple-ios15.0-simulator \
            -enable-objc-interop \
            -sdk "$SDK" \
            -Xcc -I"$(pwd)/llama-include" \
            -swift-version 5 \
            -module-name Test1 \
            -import-objc-header "$(pwd)/VanoIOS/llama_bridging.h" \
            -typecheck \
            /tmp/test1.swift 2>&1 || true
          echo "Test1 exit code: $?"
          echo ""
          echo "=== Test 2: Minimal struct ==="
          echo 'struct Foo { int x; }; typedef struct Foo Foo;' > /tmp/simple.h
          echo 'import Foundation; func test() { let m: UnsafeMutablePointer<Foo>? = nil; _ = m }' > /tmp/test2.swift
          $FRONTEND \
            -frontend \
            -target arm64-apple-ios15.0-simulator \
            -enable-objc-interop \
            -sdk "$SDK" \
            -swift-version 5 \
            -module-name Test2 \
            -import-objc-header /tmp/simple.h \
            -typecheck \
            /tmp/test2.swift 2>&1 || true
          echo "Test2 exit code: $?"
          echo ""
          echo "=== Test 3: Forward-declared struct only ==="
          echo 'struct OpaqueType;' > /tmp/forward_only.h
          echo 'import Foundation; func test() { let m: UnsafeMutablePointer<OpaqueType>? = nil; _ = m }' > /tmp/test3.swift
          $FRONTEND \
            -frontend \
            -target arm64-apple-ios15.0-simulator \
            -enable-objc-interop \
            -sdk "$SDK" \
            -swift-version 5 \
            -module-name Test3 \
            -import-objc-header /tmp/forward_only.h \
            -typecheck \
            /tmp/test3.swift 2>&1 || true
          echo "Test3 exit code: $?"
          echo ""
          echo "=== Test 4: Forward-declared struct with function using it ==="
          cat > /tmp/forward_with_fn.h << 'EOF'
          struct MyModel;
          struct MyModel * create_model(void);
          void destroy_model(struct MyModel * m);
          EOF
          echo 'import Foundation; func test() { let m: UnsafeMutablePointer<MyModel>? = nil; _ = m }' > /tmp/test4.swift
          $FRONTEND \
            -frontend \
            -target arm64-apple-ios15.0-simulator \
            -enable-objc-interop \
            -sdk "$SDK" \
            -swift-version 5 \
            -module-name Test4 \
            -import-objc-header /tmp/forward_with_fn.h \
            -typecheck \
            /tmp/test4.swift 2>&1 || true
          echo "Test4 exit code: $?"
          echo ""
          echo "=== Test 5: Only llama.h forward decl + function (no ggml) ==="
          cat > /tmp/llama_minimal.h << 'EOF'
          #ifndef LLAMA_MIN_H
          #define LLAMA_MIN_H
          #include <stdint.h>
          struct llama_model;
          struct llama_model * llama_model_load(const char * path);
          #endif
          EOF
          echo 'import Foundation; func test() { let m: UnsafeMutablePointer<llama_model>? = nil; _ = m }' > /tmp/test5.swift
          $FRONTEND \
            -frontend \
            -target arm64-apple-ios15.0-simulator \
            -enable-objc-interop \
            -sdk "$SDK" \
            -swift-version 5 \
            -module-name Test5 \
            -import-objc-header /tmp/llama_minimal.h \
            -typecheck \
            /tmp/test5.swift 2>&1 || true
          echo "Test5 exit code: $?"
      - name: Build iOS (Simulator, no signing)
        run: |
          set -o pipefail
          XCFW_SIM="$(pwd)/llama.xcframework/ios-arm64_x86_64-simulator/llama.framework"
          # Clean all caches
          rm -rf ~/Library/Developer/Xcode/DerivedData/VanoIOS-*
          rm -rf ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          xcodebuild build \
            -project VanoIOS.xcodeproj \
            -scheme VanoIOS \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_OBJC_BRIDGING_HEADER='VanoIOS/llama_bridging.h' \
            HEADER_SEARCH_PATHS='$(inherited) $(PROJECT_DIR)/llama-include' \
            LIBRARY_SEARCH_PATHS='$(inherited) '"$XCFW_SIM" \
            OTHER_LDFLAGS='$(inherited) -llama' \
            LD_RUNPATH_SEARCH_PATHS='$(inherited) @executable_path/Frameworks' \
            SWIFT_ENABLE_EXPERIMENTAL_EMIT_MODULE_SEPARATELY=NO \
            SWIFT_COMPILATION_MODE=wholemodule \
            SYMROOT=$(pwd)/build \
            2>&1 | tee xcodebuild.log | xcpretty || { echo "=== LAST 50 LINES OF LOG ==="; tail -50 xcodebuild.log; exit 1; }
          echo "=== Build dir ==="
          find $(pwd)/build -name "*.app" -type d 2>&1 | head -20
          ls -lhR $(pwd)/build/Debug-iphonesimulator/VanoIOS.app 2>&1 | head -30 || true
      - name: Create IPA
        run: |
          APP_PATH=$(find $(pwd)/build -name "VanoIOS.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found!"
            tail -100 xcodebuild.log
            exit 1
          fi
          echo "Found app at $APP_PATH"
          ls -lhR "$APP_PATH" | head -30
          du -sh "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y Vano-iOS-unsigned.ipa Payload
          rm -rf Payload
          echo "=== IPA contents ==="
          ls -lh Vano-iOS-unsigned.ipa
          unzip -l Vano-iOS-unsigned.ipa | head -20
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vano-iOS-ipa
          path: Vano-iOS-unsigned.ipa
