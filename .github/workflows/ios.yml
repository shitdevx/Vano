name: iOS Build

on:
  push:
    branches: [ main, master ]
    paths:
      - 'VanoIOS/**'
      - 'VanoIOS.xcodeproj/**'
      - 'Package.swift'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Download LlamaFramework XCFramework
        run: |
          curl -L -o llama-xcframework.zip https://github.com/ggml-org/llama.cpp/releases/download/b5046/llama-b5046-xcframework.zip
          unzip -o llama-xcframework.zip
          mv build-apple/llama.xcframework ./llama.xcframework
          rm -rf build-apple llama-xcframework.zip
          # The simulator slice has incomplete headers — copy ALL headers from tvos slice
          cp -R llama.xcframework/tvos-arm64/llama.framework/Headers/* llama.xcframework/ios-arm64_x86_64-simulator/llama.framework/Headers/
          echo "=== xcframework platforms ==="
          ls llama.xcframework/
          echo "=== Sim slice headers (should have all) ==="
          ls -la llama.xcframework/ios-arm64_x86_64-simulator/llama.framework/Headers/
          echo "=== Sim module map ==="
          cat llama.xcframework/ios-arm64_x86_64-simulator/llama.framework/Modules/module.modulemap
      - name: Build iOS (Simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project VanoIOS.xcodeproj \
            -scheme VanoIOS \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            LD_RUNPATH_SEARCH_PATHS='$(inherited) @executable_path/Frameworks' \
            SYMROOT=$(pwd)/build \
            2>&1 | tee xcodebuild.log | xcpretty || { echo "=== LAST 50 LINES OF LOG ==="; tail -50 xcodebuild.log; exit 1; }
          echo "=== Build dir ==="
          find $(pwd)/build -name "*.app" -type d 2>&1 | head -20
          ls -lhR $(pwd)/build/Debug-iphonesimulator/VanoIOS.app 2>&1 | head -30 || true
      - name: Create IPA
        run: |
          APP_PATH=$(find $(pwd)/build -name "VanoIOS.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found!"
            tail -100 xcodebuild.log
            exit 1
          fi
          echo "Found app at $APP_PATH"
          ls -lhR "$APP_PATH" | head -30
          du -sh "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y Vano-iOS-unsigned.ipa Payload
          rm -rf Payload
          echo "=== IPA contents ==="
          ls -lh Vano-iOS-unsigned.ipa
          unzip -l Vano-iOS-unsigned.ipa | head -20
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vano-iOS-ipa
          path: Vano-iOS-unsigned.ipa
